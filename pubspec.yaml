name: food_locker
description: "Track your daily weight and pace your eating one bite at a time — a local-first Flutter app."
publish_to: 'none'
version: 1.15.0

environment:
  sdk: ^3.10.4

dependencies:
  archive: ^4.0.7
  clock: ^1.1.2
  csv: ^6.0.0
  drift: ^2.28.2
  drift_flutter: ^0.3.1
  file_picker: ^10.3.10
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  intl: ^0.20.2
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4
  wakelock_plus: ^1.2.8

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.11.2
  build_runner: ^2.4.13
  drift_dev: ^2.28.2
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

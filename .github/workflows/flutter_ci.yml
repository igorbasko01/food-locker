name: Flutter CI

on:
  pull_request:
    branches: [ main ]

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    - run: flutter pub get
    - run: flutter analyze
    - run: flutter test
    - run: flutter build web --base-href=/ --no-web-resources-cdn
    - name: Check web build output
      run: |
        test -f build/web/CNAME
        test -f build/web/.nojekyll
        test -d build/web/canvaskit
        test -f build/web/sqlite3.wasm
        test -f build/web/drift_worker.js

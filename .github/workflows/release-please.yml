on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # This configures it to look for a Dart/Flutter project and update pubspec.yaml
          release-type: dart
